<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	th:replace="~{common/layout_3block :: layout(~{::title},~{::body/content()})}">

<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title th:text="#{login}+' | '+ #{shop.title}"> </title>
</head>

<body class="user_login">
<div id="userLogin">
	<div class="login-wrapper">
		<div class="login-card">
			<div class="login-header">
				<h1 th:class="login-title" th:text="#{login}"></h1>
				<p th:class="login-subtitle" th:text="#{msg.login.input}"></p>
			</div>

			<form th:action="@{/login}" method="post" class="login-form" th:object="${loginForm}">
				<!-- Error Messages -->
				<th:block th:if="${#fields.hasErrors()}">
					<div class="login-errors">
						<ul class="error-list">
							<li th:each="err:${#fields.detailedErrors()}" th:text="${err.message}"></li>
						</ul>
					</div>
				</th:block>

				<!-- Email Field -->
				<div class="form-group">
					<label th:for="email" class="form-label" th:text="#{loginForm.email}"></label>
					<input type="text" th:field="*{email}" class="form-input" placeholder="Enter your email" />
				</div>

				<!-- Password Field -->
				<div class="form-group">
					<label th:for="password" class="form-label" th:text="#{loginForm.password}"></label>
					<input type="password" th:field="*{password}" class="form-input" placeholder="Enter your password" />
				</div>

				<!-- Login Button -->
				<button type="submit" class="btn-login" th:value="#{login}" th:text="#{login}"></button>
			</form>

			<!-- Register Link -->
			<div class="login-footer">
				<p class="footer-text">
					<span th:text="#{client.regist}"></span> 
					<a th:href="@{/client/user/regist/email}" class="register-link">
						<span>Register here</span>
					</a>
				</p>
			</div>
		</div>

		<!-- Back to Top Button -->
		<div class="back-link-wrapper">
			<a th:href="@{/}" class="back-to-home">
				<button id="backToTopButton" class="btn-back" th:text="#{msg.back.to.top}"></button>
			</a>
		</div>
	</div>
</div>
<script th:src="@{/js/common.js}"></script>
</body>

</html>
