<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	th:replace="~{common/layout_5block :: layout(~{::title},~{::body/content()})}">

<head>
	<title th:text="#{basket}+' | '+ #{shop.title}"> </title>
	<meta charset="UTF-8" />
</head>
<body>

<div th:if="${isnull}" > 
<h1 th:text="${message}" > </h1>

 </div>

<div th:unless="${isnull}" >
<table >
  <tr>
    <th>Order No.</th><th>Date</th><th>Status</th><th>Total</th><th></th>
  </tr>
  <tr th:each="order : ${orders}">
    <td th:text="${order.id}"></td>
    <td th:text="${#dates.format(order.insertDate, 'yyyy-MM-dd')}"></td>
    <td th:text="${order.status}"></td>
   <!-- <td th:text="${total[order.id]}"></td>-->
   <td>
    <form th:action="@{/client/order/detail}" method="post">
        <input type="hidden" name="id" th:value="${order.id}">
        <button type="submit">Detail</button>
    </form>
</td>
     
  </tr>
</table>
</div>
 
<div th:if="${isCancelledNull}" >   
<h2> No canceled request or canceled history available  </h2>
</div>
<div th:unless="${isCancelledNull}" >
<h2> canceled history or cancel request list </h2>
<table >
  <tr>
    <th>Order No.</th><th>Date</th><th>Status</th><th>Total</th><th></th>
  </tr>
  <tr th:each="order : ${cancelledOrders}">
    <td th:text="${order.id}"></td>
    <td th:text="${#dates.format(order.insertDate, 'yyyy-MM-dd')}"></td>
    <td>
  <span th:switch="${order.cancelFlag}">
					<span th:case="1">Cancel Requested</span>
					<span th:case="2"> Cancel Processing</span>
					<span th:case="3">Refunding</span>
					<span th:case="4">Refunded</span>
					<span th:case="5">Unable to Refund</span>
				</span>
    
    
    
    </td>
   <!-- <td th:text="${total[order.id]}"></td>-->
   <td>
    <form th:action="@{/client/order/detail}" method="post">
        <input type="hidden" name="id" th:value="${order.id}">
        <button type="submit">Detail</button>
    </form>
</td>
     
  </tr>
</table>
</div>




</body>
</html>
