<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="stylesheet" type="text/css" th:href="@{/css/layout.css}" />
<link rel="stylesheet" type="text/css" th:href="@{/css/stylesheet.css}" />

<title th:text="#{confirm}+' | '+ #{shop.title}"> </title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background: linear-gradient(135deg, #fff5eb 0%, #ffe8d6 100%);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }

  .card {
    background: #ffffff;
    width: 100%;
    max-width: 420px;
    border-radius: 16px;
    box-shadow: 0 10px 40px rgba(0,0,0,0.08);
    padding: 40px 32px;
    text-align: center;
    position: relative;
  }

  .back-btn {
    position: absolute;
    top: 20px;
    left: 20px;
    width: 36px;
    height: 36px;
    border-radius: 50%;
    border: none;
    background: #f5f5f5;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: background 0.2s;
  }
  .back-btn:hover { background: #ebebeb; }
  .back-btn svg { width: 18px; height: 18px; fill: #333; }

  .logo {
    font-size: 22px;
    font-weight: 700;
    color: #e85d04;
    margin-bottom: 8px;
    margin-top: 8px;
  }

  .icon-circle {
    width: 70px;
    height: 70px;
    background: #fff0e0;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 8px auto 20px;
  }
  .icon-circle svg { width: 32px; height: 32px; stroke: #e85d04; }

  h1 {
    font-size: 20px;
    color: #1a1a1a;
    margin-bottom: 8px;
  }

  .subtitle {
    font-size: 14px;
    color: #777;
    line-height: 1.5;
    margin-bottom: 4px;
  }

  .email-display {
    font-size: 14px;
    font-weight: 600;
    color: #e85d04;
    margin-bottom: 28px;
    word-break: break-all;
  }

  .otp-inputs {
    display: flex;
    justify-content: center;
    gap: 10px;
    margin-bottom: 22px;
  }

  .otp-inputs input {
    width: 46px;
    height: 54px;
    text-align: center;
    font-size: 22px;
    font-weight: 600;
    border: 2px solid #e0e0e0;
    border-radius: 10px;
    outline: none;
    transition: border-color 0.2s, box-shadow 0.2s;
    color: #1a1a1a;
  }
  .otp-inputs input:focus {
    border-color: #e85d04;
    box-shadow: 0 0 0 3px rgba(232,93,4,0.12);
  }
  .otp-inputs input.filled { border-color: #e85d04; }

  .error-msg {
    color: #e02424;
    font-size: 13px;
    min-height: 18px;
    margin-bottom: 14px;
    display: none;
  }
  .error-msg.show { display: block; }

  .timer {
    font-size: 13px;
    color: #888;
    margin-bottom: 24px;
  }
  .timer span { color: #e85d04; font-weight: 600; }

  .resend-link {
    color: #e85d04;
    font-weight: 600;
    cursor: pointer;
    text-decoration: none;
  }
  .resend-link:hover { text-decoration: underline; }
  .resend-link.disabled {
    color: #bbb;
    cursor: not-allowed;
    text-decoration: none;
  }

  .verify-btn {
    width: 100%;
    padding: 14px;
    background: #e85d04;
    color: #fff;
    border: none;
    border-radius: 10px;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.2s, transform 0.1s;
    margin-bottom: 14px;
  }
  .verify-btn:hover { background: #d34e00; }
  .verify-btn:active { transform: scale(0.98); }
  .verify-btn:disabled {
    background: #f0b98a;
    cursor: not-allowed;
  }

  .footer-text {
    font-size: 13px;
    color: #999;
  }

  .footer-text a {
    color: #e85d04;
    text-decoration: none;
    font-weight: 600;
  }

  @media (max-width: 400px) {
    .otp-inputs input { width: 40px; height: 48px; font-size: 18px; }
    .card { padding: 32px 20px; }
  }
</style>
</head>
<body>

<div class="card">
  <button class="back-btn" onclick="goBack()" aria-label="Back">
    <svg viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
  </button>

  <div class="logo">🛒 Nepali Pasal</div>

  <div class="icon-circle">
    <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M22 6l-10 7L2 6"/>
      <rect x="2" y="4" width="20" height="16" rx="2"/>
    </svg>
  </div>

  <h1>कोड प्रमाणित गर्नुहोस्</h1>
  <p class="subtitle">हामीले तपाईंको इमेलमा 6 अंकको कोड पठाएका छौं</p>
  <div class="email-display" th:text ="*{email}" id="emailDisplay">user@example.com</div>

  <div class="otp-inputs" id="otpInputs">
    <input type="text" inputmode="numeric" maxlength="1" data-index="0">
    <input type="text" inputmode="numeric" maxlength="1" data-index="1">
    <input type="text" inputmode="numeric" maxlength="1" data-index="2">
    <input type="text" inputmode="numeric" maxlength="1" data-index="3">
    <input type="text" inputmode="numeric" maxlength="1" data-index="4">
    <input type="text" inputmode="numeric" maxlength="1" data-index="5">
  </div>

  <div class="error-msg" id="errorMsg">कोड मिलेन, फेरि प्रयास गर्नुहोस्</div>

  <div class="timer" id="timerText">
    कोड फेरि पठाउनुहोस् <span id="countdown">00:60</span> मा
  </div>

  <button class="verify-btn" id="verifyBtn" onclick="verifyCode()">प्रमाणित गर्नुहोस्</button>

  <p class="footer-text">
    कोड पाउनुभएन? <a  th:href="@{/client/user/regist/email/send}" class="resend-link disabled" id="resendLink" >पुन: पठाउनुहोस्</a>
  </p>
</div>
<a th:href="@{/}" > <button> Back</button> </a>
<script> 

const FixedUrl = "http://localhost:55000/shared_shop/";

function verifyCode() {
const code = [...document.querySelectorAll('#otpInputs input')].map(i => i.value).join('');
console.log('Verifying code:', code);
fetch(`${FixedUrl}client/user/regist/email/verify` )
.then (response => response.text())
.then(data => {
console.log('Verification response:', data);
if(code === data){
window.location.href= `${FixedUrl}client/user/regist/input/init`;
}else{
alert("error: code does not match");
}
})

}
//---- Resend countdown timer ----
let seconds = 60;
const countdownEl = document.getElementById('countdown');
const resendLink = document.getElementById('resendLink');
const timerText = document.getElementById('timerText');

const timerInterval = setInterval(() => {
  seconds--;
  const mm = String(Math.floor(seconds / 60)).padStart(2, '0');
  const ss = String(seconds % 60).padStart(2, '0');
  countdownEl.textContent = `${mm}:${ss}`;
  if (seconds <= 0) {
    clearInterval(timerInterval);
    timerText.style.display = 'none';
    resendLink.classList.remove('disabled');
  }
}, 1000);

function resendCode(e) {
  e.preventDefault();
  if (resendLink.classList.contains('disabled')) return;
  // ---- Call your resend-OTP API here ----
  alert('कोड पुन: पठाइयो: ' + email);
  seconds = 60;
  resendLink.classList.add('disabled');
  timerText.style.display = 'block';
}

</script>

</html>
