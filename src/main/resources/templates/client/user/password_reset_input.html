<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<link rel="stylesheet" type="text/css" th:href="@{/css/layout.css}" />
	<link rel="stylesheet" type="text/css" th:href="@{/css/stylesheet.css}" />
	<link rel="stylesheet" type="text/css" th:href="@{/css/forms.css}" />
	<title th:text="#{password}+' '+#{reset}+' | '+ #{shop.title}">Password Reset | Nepali Pasal</title>
	<style>
		/* Password Reset Specific Scoped Styles */
		.password-reset-wrapper {
			min-height: 100vh;
			display: flex;
			flex-direction: column;
		}

		.password-reset-wrapper main {
			flex: 1;
			display: flex;
			align-items: center;
			justify-content: center;
			padding: var(--spacing-lg) var(--spacing-md);
			background: linear-gradient(135deg, var(--color-secondary-bg) 0%, #e3f2fd 100%);
		}

		.password-reset-container {
			width: 100%;
			max-width: 100%;
			display: flex;
			align-items: center;
			justify-content: center;
		}

		.password-reset-card {
			background: var(--color-bg-white);
			width: 100%;
			max-width: 100%;
			border-radius: var(--radius-lg);
			box-shadow: var(--shadow-md);
			padding: var(--spacing-xl) var(--spacing-md);
			animation: slideUp 0.5s ease-out;
			position: relative;
		}

		@keyframes slideUp {
			from { opacity: 0; transform: translateY(30px); }
			to { opacity: 1; transform: translateY(0); }
		}

		.password-reset-header {
			text-align: center;
			margin-bottom: var(--spacing-lg);
			padding-bottom: var(--spacing-lg);
			border-bottom: 1px solid var(--color-border);
		}

		.password-reset-title {
			font-size: 20px;
			font-weight: 700;
			color: var(--color-text-primary);
			margin: 0;
			letter-spacing: -0.5px;
			margin-bottom: var(--spacing-sm);
		}

		.password-reset-subtitle {
			font-size: 14px;
			color: var(--color-text-light);
			margin: 0;
			line-height: 1.5;
			font-weight: 400;
		}

		.password-reset-content {
			display: flex;
			flex-direction: column;
		}

		.reset-step {
			display: none;
		}

		.reset-step.active {
			display: block;
		}

		.reset-step-number {
			font-size: 12px;
			font-weight: 600;
			color: var(--color-secondary);
			text-transform: uppercase;
			letter-spacing: 0.5px;
			margin-bottom: var(--spacing-md);
		}

		.reset-form-group {
			display: flex;
			flex-direction: column;
			gap: var(--spacing-sm);
			margin-bottom: var(--spacing-lg);
		}

		.reset-form-label {
			font-size: 12px;
			font-weight: 600;
			color: var(--color-text-primary);
			text-transform: uppercase;
			letter-spacing: 0.5px;
			display: block;
		}

		.reset-form-input,
		.reset-form-textarea {
			width: 100%;
			padding: var(--spacing-md) var(--spacing-md);
			font-size: 16px;
			border: 2px solid var(--color-border);
			border-radius: var(--radius-md);
			transition: all 0.15s ease;
			font-family: inherit;
			color: var(--color-text-primary);
			background-color: var(--color-bg-white);
			-webkit-appearance: none;
			appearance: none;
			box-shadow: none;
		}

		.reset-form-input::placeholder,
		.reset-form-textarea::placeholder {
			color: #bbb;
		}

		.reset-form-input:focus,
		.reset-form-textarea:focus {
			outline: none;
			border-color: var(--color-secondary);
			box-shadow: 0 0 0 3px rgba(61, 152, 191, 0.12);
		}

		.reset-form-input.error {
			border-color: var(--color-error);
			background-color: #fff5f5;
		}

		.reset-error-msg {
			background-color: #fed7d7;
			border-left: 4px solid var(--color-error);
			border-radius: var(--radius-md);
			padding: var(--spacing-md);
			margin-bottom: var(--spacing-lg);
			color: var(--color-error);
			font-size: 13px;
			line-height: 1.4;
			display: none;
		}

		.reset-error-msg.show {
			display: block;
		}

		.reset-success-msg {
			background-color: #d4edda;
			border-left: 4px solid var(--color-success);
			border-radius: var(--radius-md);
			padding: var(--spacing-md);
			margin-bottom: var(--spacing-lg);
			color: #155724;
			font-size: 13px;
			line-height: 1.4;
			display: none;
		}

		.reset-success-msg.show {
			display: block;
		}

		.reset-actions {
			display: flex;
			flex-direction: column;
			gap: var(--spacing-md);
			margin-top: var(--spacing-lg);
		}

		.reset-btn {
			padding: var(--spacing-md) var(--spacing-lg);
			font-size: 14px;
			font-weight: 600;
			border: 2px solid transparent;
			border-radius: var(--radius-md);
			cursor: pointer;
			transition: all 0.3s ease;
			text-align: center;
			white-space: nowrap;
			font-family: inherit;
			text-transform: uppercase;
			letter-spacing: 0.5px;
			display: inline-block;
			line-height: 1;
			width: 100%;
			touch-action: manipulation;
			-webkit-user-select: none;
			user-select: none;
		}

		.reset-btn:active {
			transform: scale(0.96);
		}

		.reset-btn:disabled {
			opacity: 0.6;
			cursor: not-allowed;
		}

		.reset-btn-primary {
			background: var(--color-secondary);
			color: var(--color-bg-white);
			border: 2px solid var(--color-secondary);
		}

		.reset-btn-primary:hover:not(:disabled) {
			background: var(--color-secondary-dark);
			border-color: var(--color-secondary-dark);
			box-shadow: 0 4px 12px rgba(61, 152, 191, 0.3);
			transform: translateY(-2px);
		}

		.reset-btn-secondary {
			background: transparent;
			color: var(--color-secondary);
			border: 2px solid var(--color-secondary);
		}

		.reset-btn-secondary:hover:not(:disabled) {
			background: var(--color-secondary-bg);
			border-color: var(--color-secondary);
		}

		.reset-footer {
			text-align: center;
			margin-top: var(--spacing-lg);
			padding-top: var(--spacing-lg);
			border-top: 1px solid var(--color-border);
		}

		.reset-footer-text {
			margin: 0;
			font-size: 13px;
			color: var(--color-text-light);
		}

		.reset-footer-link {
			color: var(--color-secondary);
			text-decoration: none;
			font-weight: 600;
			transition: all 0.15s ease;
			cursor: pointer;
		}

		.reset-footer-link:hover {
			color: var(--color-secondary-dark);
			text-decoration: underline;
		}

		.password-strength {
			height: 4px;
			background-color: var(--color-border);
			border-radius: 2px;
			margin-top: var(--spacing-sm);
			overflow: hidden;
		}

		.password-strength-bar {
			height: 100%;
			border-radius: 2px;
			transition: all 0.3s ease;
			width: 0%;
		}

		.password-strength-bar.weak {
			background-color: #ff6b6b;
			width: 33%;
		}

		.password-strength-bar.medium {
			background-color: #ffc107;
			width: 66%;
		}

		.password-strength-bar.strong {
			background-color: #27a745;
			width: 100%;
		}

		.timer-text {
			font-size: 13px;
			color: var(--color-text-light);
			text-align: center;
			margin: var(--spacing-lg) 0;
		}

		.timer-countdown {
			color: var(--color-secondary);
			font-weight: 600;
			font-family: 'Courier New', monospace;
		}

		.timer-hidden {
			display: none;
		}

		@media (min-width: 480px) {
			.password-reset-card {
				max-width: 500px;
				padding: var(--spacing-2xl) var(--spacing-lg);
				box-shadow: var(--shadow-lg);
			}

			.password-reset-title {
				font-size: 22px;
			}
		}

		@media (min-width: 768px) {
			.password-reset-wrapper main {
				padding: var(--spacing-xl);
			}

			.password-reset-card {
				max-width: 550px;
				padding: var(--spacing-3xl) var(--spacing-2xl);
				box-shadow: var(--shadow-xl);
			}

			.password-reset-title {
				font-size: 24px;
			}

			.reset-actions {
				flex-direction: row;
				gap: var(--spacing-lg);
			}

			.reset-actions .reset-btn {
				flex: 1;
				width: auto;
			}
		}

		@media (min-width: 1024px) {
			.password-reset-card {
				max-width: 600px;
			}

			.password-reset-title {
				font-size: 28px;
			}
		}

		@media (hover: none) and (pointer: coarse) {
			.reset-btn,
			.reset-form-input {
				min-height: 44px;
				font-size: 16px;
			}

			.reset-form-input {
				padding: var(--spacing-md) var(--spacing-lg);
			}
		}
	</style>
</head>
<body>
	<div class="password-reset-wrapper">
		<!-- Header Fragment -->
		<header th:replace="~{common/header :: layout-header}"></header>

		<!-- Main Content -->
		<main>
			<div class="password-reset-container">
				<div class="password-reset-card">
					<!-- Header -->
					<div class="password-reset-header">
						<h1 class="password-reset-title">パスワードをリセット</h1>
						<p class="password-reset-subtitle">アカウントのパスワードをリセットできます</p>
					</div>

					<!-- Content -->
					<div class="password-reset-content">

						<!-- STEP 1: Email Verification -->
						<div class="reset-step active" id="step1">
							<div class="reset-step-number">ステップ 1 / 3 - メール確認</div>

							<div class="reset-error-msg" id="step1Error"></div>

							<div class="reset-form-group">
								<label class="reset-form-label">メールアドレス</label>
								<input type="email" id="emailInput" class="reset-form-input" placeholder="登録されているメールアドレスを入力" />
								<small style="font-size: 11px; color: var(--color-text-light); margin-top: -4px;">最後に使用したメールアドレスです</small>
							</div>

							<div class="reset-actions">
								<button class="reset-btn reset-btn-primary" onclick="sendVerificationCode()">確認コードを送信</button>
								<a th:href="@{/login}" class="reset-btn reset-btn-secondary" style="text-decoration: none; display: flex; align-items: center; justify-content: center;">戻る</a>
							</div>

							<div class="timer-text timer-hidden" id="step1Timer">
								再度送信できるまで <span class="timer-countdown" id="countdown1">00:60</span>
							</div>
						</div>

						<!-- STEP 2: Code Verification -->
						<div class="reset-step" id="step2">
							<div class="reset-step-number">ステップ 2 / 3 - コード確認</div>

							<div class="reset-error-msg" id="step2Error"></div>
							<div class="reset-success-msg" id="step2Success"></div>

							<div class="reset-form-group">
								<label class="reset-form-label">確認コード</label>
								<small style="font-size: 11px; color: var(--color-text-light); margin-bottom: var(--spacing-sm);">メールに送信されたコードを入力してください</small>
								<input type="text" id="codeInput" class="reset-form-input" placeholder="6桁のコードを入力" maxlength="6" />
							</div>

							<div class="reset-actions">
								<button class="reset-btn reset-btn-primary" onclick="verifyCode()">確認コードを検証</button>
								<button class="reset-btn reset-btn-secondary" onclick="goBackToStep1()">戻る</button>
							</div>

							<div class="timer-text" id="step2Timer">
								再度送信できるまで <span class="timer-countdown" id="countdown2">00:60</span>
							</div>
						</div>

						<!-- STEP 3: Password Reset -->
						<div class="reset-step" id="step3">
							<div class="reset-step-number">ステップ 3 / 3 - パスワード変更</div>

							<div class="reset-error-msg" id="step3Error"></div>

							<div class="reset-form-group">
								<label class="reset-form-label">新しいパスワード</label>
								<input type="password" id="newPasswordInput" class="reset-form-input" placeholder="新しいパスワードを入力" oninput="checkPasswordStrength()" />
								<div class="password-strength">
									<div class="password-strength-bar" id="strengthBar"></div>
								</div>
								<small style="font-size: 11px; color: var(--color-text-light); margin-top: 4px;" id="strengthText">パスワードの強度: 弱い</small>
							</div>

							<div class="reset-form-group">
								<label class="reset-form-label">パスワードを確認</label>
								<input type="password" id="confirmPasswordInput" class="reset-form-input" placeholder="パスワードを再入力" />
							</div>

							<div class="reset-actions">
								<button class="reset-btn reset-btn-primary" onclick="resetPassword()">パスワードをリセット</button>
								<button class="reset-btn reset-btn-secondary" onclick="goBackToStep1()">戻る</button>
							</div>
						</div>

					</div>

					<!-- Footer -->
					<div class="reset-footer">
						<p class="reset-footer-text">
							パスワードを思い出しましたか? <a th:href="@{/login}" class="reset-footer-link">ログインする</a>
						</p>
					</div>
				</div>
			</div>
		</main>

		<!-- Footer Fragment -->
		<footer th:replace="~{common/footer :: layout-footer}"></footer>
	</div>

	<script>
		const FixedUrl = "http://localhost:55000/shared_shop/";
		let currentStep = 1;
		let verificationCode = null;
		let userEmail = null;
		let codeTimers = {1: null, 2: null};
		let codeCounts = {1: 60, 2: 60};

		function showStep(stepNumber) {
			document.querySelectorAll('.reset-step').forEach(step => {
				step.classList.remove('active');
			});
			document.getElementById('step' + stepNumber).classList.add('active');
			currentStep = stepNumber;
		}

		function showError(stepNumber, message) {
			const errorEl = document.getElementById('step' + stepNumber + 'Error');
			errorEl.textContent = message;
			errorEl.classList.add('show');
			setTimeout(() => {
				errorEl.classList.remove('show');
			}, 5000);
		}

		function showSuccess(stepNumber, message) {
			const successEl = document.getElementById('step' + stepNumber + 'Success');
			successEl.textContent = message;
			successEl.classList.add('show');
		}

		function sendVerificationCode() {
			const email = document.getElementById('emailInput').value.trim();

			if (!email || !email.includes('@')) {
				showError(1, 'メールアドレスが正しくありません');
				return;
			}

			userEmail = email;
			
		

			// Call API to send code
			fetch(`${FixedUrl}client/user/password/reset/send-code`, {
				method: 'POST',
				headers: {
					'Content-Type': 'application/json'
				},
				body: JSON.stringify({email: email})
			})
			.then(response => response.json())
			.then(data => {
				if (data.success) {
					showStep(2);
					startTimer(2);
					showSuccess(2, 'コードがメールアドレスに送信されました');
				} else {
					showError(1, data.message || 'エラーが発生しました');
				}
			})
			.catch(error => {
				showError(1, 'ネットワークエラーが発生しました');
				console.error('Error:', error);
			});
		}

		function verifyCode() {
			const code = document.getElementById('codeInput').value.trim();

			if (!code || code.length !== 6) {
				showError(2, '6桁のコードを入力してください');
				return;
			}

			// Call API to verify code
			fetch(`${FixedUrl}client/user/password/reset/verify-code`, {
				method: 'POST',
				headers: {
					'Content-Type': 'application/json'
				},
				body: JSON.stringify({email: userEmail, code: code})
			})
			.then(response => response.json())
			.then(data => {
				if (data.success) {
					verificationCode = code;
					showStep(3);
					if (codeTimers[2]) clearInterval(codeTimers[2]);
				} else {
					showError(2, 'コードが正しくありません');
				}
			})
			.catch(error => {
				showError(2, 'ネットワークエラーが発生しました');
				console.error('Error:', error);
			});
		}

		function resetPassword() {
			const newPassword = document.getElementById('newPasswordInput').value;
			const confirmPassword = document.getElementById('confirmPasswordInput').value;

			if (!newPassword || newPassword.length < 8) {
				showError(3, 'パスワードは8文字以上である必要があります');
				return;
			}

			if (newPassword !== confirmPassword) {
				showError(3, 'パスワードが一致しません');
				return;
			}

			// Call API to reset password
			fetch(`${FixedUrl}client/user/password/reset/confirm`, {
				method: 'POST',
				headers: {
					'Content-Type': 'application/json'
				},
				body: JSON.stringify({
					email: userEmail,
					code: verificationCode,
					newPassword: newPassword
				})
			})
			.then(response => response.json())
			.then(data => {
				if (data.success) {
					alert('パスワードがリセットされました');
					window.location.href = `${FixedUrl}login`;
				} else {
					showError(3, data.message || 'エラーが発生しました');
				}
			})
			.catch(error => {
				showError(3, 'ネットワークエラーが発生しました');
				console.error('Error:', error);
			});
		}

		function goBackToStep1() {
			if (codeTimers[2]) clearInterval(codeTimers[2]);
			if (codeTimers[1]) clearInterval(codeTimers[1]);
			showStep(1);
			document.getElementById('emailInput').value = '';
			document.getElementById('codeInput').value = '';
			document.getElementById('newPasswordInput').value = '';
			document.getElementById('confirmPasswordInput').value = '';
		}

		function startTimer(stepNumber) {
			const timerEl = document.getElementById('step' + stepNumber + 'Timer');
			const countdownEl = document.getElementById('countdown' + stepNumber);

			codeCounts[stepNumber] = 60;

			if (codeTimers[stepNumber]) clearInterval(codeTimers[stepNumber]);

			timerEl.classList.remove('timer-hidden');

			codeTimers[stepNumber] = setInterval(() => {
				codeCounts[stepNumber]--;
				const mm = String(Math.floor(codeCounts[stepNumber] / 60)).padStart(2, '0');
				const ss = String(codeCounts[stepNumber] % 60).padStart(2, '0');
				countdownEl.textContent = `${mm}:${ss}`;

				if (codeCounts[stepNumber] <= 0) {
					clearInterval(codeTimers[stepNumber]);
					timerEl.classList.add('timer-hidden');
				}
			}, 1000);
		}

		function checkPasswordStrength() {
			const password = document.getElementById('newPasswordInput').value;
			const strengthBar = document.getElementById('strengthBar');
			const strengthText = document.getElementById('strengthText');

			let strength = 'weak';
			let score = 0;

			if (password.length >= 8) score++;
			if (password.length >= 12) score++;
			if (/[a-z]/.test(password) && /[A-Z]/.test(password)) score++;
			if (/[0-9]/.test(password)) score++;
			if (/[!@#$%^&*]/.test(password)) score++;

			if (score <= 1) {
				strength = 'weak';
				strengthBar.className = 'password-strength-bar weak';
				strengthText.textContent = 'パスワードの強度: 弱い';
			} else if (score <= 3) {
				strength = 'medium';
				strengthBar.className = 'password-strength-bar medium';
				strengthText.textContent = 'パスワードの強度: 中程度';
			} else {
				strength = 'strong';
				strengthBar.className = 'password-strength-bar strong';
				strengthText.textContent = 'パスワードの強度: 強い';
			}
		}
	</script>
</body>
</html>
