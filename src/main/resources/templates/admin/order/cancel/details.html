<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	th:replace="~{common/layout_3block :: layout(~{::title},~{::body/content()})}">

<head>
	<meta charset="UTF-8" />
	<title th:text="#{admin.menu}+' | '+ #{shop.title}"> </title>
	<script type="text/javascript" th:src="@{/js/common.js}"></script>
    <link rel="stylesheet" type="text/css" th:href="@{/css/Admin/cancelOrder/details.css}" />

</head>
<body>
<div class="container">

  <a class="back" th:href="@{/admin/order/cancel/list}">&larr; Back to list</a>

  <div class="card">
    <h2>Order <span th:text="'#' + ${orders.id}">#1</span> <span class="badge" >Cancelled</span></h2>
    <div class="info">
      <span class="label">Customer</span>      <span th:text="${orders.name}">-</span>
     <!--  <span class="label">Order date</span>    <span th:text="${#temporals.format(order.orderDate, 'yyyy-MM-dd HH:mm')}">-</span>
    -->   <span class="label">Address</span>       <span th:text="${orders.address}">-</span>
      <span class="label">Payment method</span>
      <span th:switch="${orders.payMethod}">
					<span th:case="1">[[#{paymethod.credit.str}]]</span>
					<span th:case="2">[[#{paymethod.bank.str}]]</span>
					<span th:case="3">[[#{paymethod.onarrival.str}]]</span>
					<span th:case="4">[[#{paymethod.emoney.str}]]</span>
					<span th:case="5">[[#{paymethod.convenience.str}]]</span>
				</span>
      <span class="label">Status</span>        <span th:text="${orders.status}">-</span>
    </div>
  </div>

  <div class="card">
    <h2>Items</h2>
    <table>
      <thead>
        <tr>
          <th>Item</th>
          <th class="num">Unit price</th>
          <th class="num">Qty</th>
          <th class="num">Subtotal</th>
        </tr>
      </thead>
      
      <tbody>
        <tr >
          <td th:text="${order.item.name}">Item name</td>
          <td class="num" th:text="${order.item.price}">0</td>
          <td class="num" th:text="${order.quantity}">0</td>
          <td class="num" th:text="${order.item.price * order.quantity}">0</td>
        
      </tbody>
      
     <!--  <tbody>
        <tr th:each="oi : ${orders.OrderItemsList}">
          <td th:text="${oi.item.name}">Item name</td>
          <td class="num" th:text="${oi.price}">0</td>
          <td class="num" th:text="${oi.quantity}">0</td>
          <td class="num" th:text="${oi.price * oi.quantity}">0</td>
        
      </tbody> -->
    </table>
    <div class="total">Total: Rs. <span th:text="${order.total}">0</span></div>
    
  </div>

</div>
<div> 
<form th:action="@{/}"> 
<input type="submit" value="Reject" class="back_button" />
</form>

<form th:action="@{/}">
<input type="submit" value="Approve" class="back_button" />

</form>


</div>
</body>
</html>
