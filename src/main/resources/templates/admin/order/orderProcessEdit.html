<div id="orderDetailsInputArea" >  
<h1>Order Details Input Area </h1>

</div>

<form th:object="${orderInquiriesForm}" th:action="@{/admin/order/edit/success}" method="post">
    <span>Inquiry Code</span>     <input type="text" th:field="*{inquiryCode}">
    <span>Customer Name</span>    <input  type="text" th:field="*{customerName}" readonly >
    <span>Customer Phone</span>   <input type="text" th:field="*{customerPhone}" readonly>
    <span>Customer Address</span> <input type="text" th:field="*{customerAddress}" readonly >
   <!--  <span>Sent By</span>          <input type="number" th:field="*{sentBy}"> -->
    <span>Sent At</span>          <input type="date" th:field="*{sentAt}" readonly>
    <span>Expire At</span>        <input type="date" th:field="*{expiresAt}" readonly>
    <span>Use Flag</span>         <input type="text" th:field="*{usedFlag}" readonly>
    <input type="submit" value="Submit">
</form>
