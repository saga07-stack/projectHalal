<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	th:replace="~{common/layout_4block :: layout(~{::title},~{::body/content()})}">

<head>
	<title th:text="#{item}+#{title.update.input}+' | '+ #{shop.title}"> </title>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
</head>

<body class="admin item_update_input">
	<div class="form-container admin-form">
		<div class="form-card admin">
			<div class="form-header with-border">
				<h2 class="form-title" th:text="#{item}+#{title.update.input}"></h2>
				<p class="form-subtitle" th:text="#{msg.update.input}"></p>
			</div>

			<form th:action="@{/admin/item/update/check}" enctype="multipart/form-data" method="post" th:object="${itemForm}">
				<th:block th:if="${#fields.hasErrors()}">
					<div class="error-container">
						<ul class="error-list">
							<li th:each="err:${#fields.detailedErrors()}" th:text="${err.message}"></li>
						</ul>
					</div>
				</th:block>

				<div class="input-list">
					<div class="form-group">
						<label class="form-label">[[#{itemForm.name}]]</label>
						<input type="text" th:field="*{name}" class="form-input" />
					</div>
					<div class="form-group">
						<label class="form-label">[[#{itemForm.price}]]</label>
						<input type="text" th:field="*{price}" class="form-input" />
					</div>
					<div class="form-group">
						<label class="form-label">[[#{itemForm.stock}]]</label>
						<input type="text" th:field="*{stock}" class="form-input" />
					</div>
					<div class="form-group">
						<label class="form-label">[[#{data.category}]]</label>
						<select name="categoryId" class="form-select">
							<option th:each="category: ${categories}" th:value="${category.id}"
								th:selected="${category.id == itemForm.categoryId}" th:text="${category.name}"></option>
						</select>
					</div>
					<div class="form-group">
						<label class="form-label">[[#{itemForm.description}]]</label>
						<textarea rows="6" th:field="*{description}" class="form-textarea"></textarea>
					</div>
					<div class="form-group">
						<label class="form-label">[[#{data.item.image}]]</label>
						<input type="file" id="upload_file" th:field="*{imageFile}" class="form-input" />
						<div style="margin-top: var(--spacing-md);">
							<img th:if="*{!#strings.isEmpty(image)}" th:src="@{/images/{image}(image=*{image})}" style="max-width: 300px; height: auto; border-radius: var(--radius-md); box-shadow: var(--shadow-sm);" />
							<img th:if="*{#strings.isEmpty(image)}" th:src="@{/images/common/no_image.jpg}" style="max-width: 300px; height: auto; border-radius: var(--radius-md); box-shadow: var(--shadow-sm);" />
						</div>
					</div>
				</div>

				<input type="hidden" th:field="*{id}" />

				<div class="form-actions two-buttons">
					<button type="submit" class="btn btn-primary send_button">確認</button>
					<a th:href="@{/admin/item/detail/{id}(id=${itemForm.id})}" class="btn btn-secondary back_button">戻る</a>
				</div>
			</form>
		</div>
	</div>
</body>

</html>
