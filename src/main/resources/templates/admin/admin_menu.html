<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	th:replace="~{common/layout_3block :: layout(~{::title},~{::body/content()})}">

<head>
	<meta charset="UTF-8" />
	<title th:text="#{admin.menu}+' | '+ #{shop.title}"> </title>]
	<script type="text/javascript" th:src="@{/js/common.js}"></script>
</head>

<body class="admin admin_menu">
	<div class="admin_menu">
		<dl class="admin_menu_list">
			<dt class="title_area_no_shadow" th:text="#{admin.menu}"></dt>
			<div class="link_are_containe">
			<dd class="link_area">
			<a th:href="@{/admin/user/list}" th:text="#{admin.menu.user.list}"></a></dd>
			<th:block th:if="${session.user.authority == 1}">
				<dd id="counts" class="link_area"><a th:href="@{/admin/order/list}" th:text="#{admin.menu.order.list}"></a><span id="count_badge">0</span></dd>
			
				<dd  class="link_area"><a th:href="@{/admin/item/list}" th:text="#{admin.menu.item.list}"></a></dd>  
				
	
				<dd class="link_area"><a th:href="@{/admin/category/list}" th:text="#{admin.menu.category.list}"></a></dd>
				<dd class="link_area"><a th:href="@{/admin/expired/list}" th:text="#{admin.menu.Expired.list}"></a></dd>
			
			
			</th:block>
			</div>
		</dl>
	</div>
	
	
	<script type="text/javascript">
	const FixedUrl = "http://localhost:55000/shared_shop/";

const countBadge = document.getElementById('count_badge');

fetch(`${FixedUrl}admin/list`)
   .then(response => response.json())
   .then(data => {
	   console.log('Order count:', data.count);
	   countBadge.textContent = data.count;
   }).catch(error => {
	   console.error('Error fetching order count:', error);
   });
   

	
	</script>
	
	
</body>

</html>
