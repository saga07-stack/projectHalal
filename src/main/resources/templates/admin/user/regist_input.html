<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	th:replace="~{common/layout_4block :: layout(~{::title},~{::body/content()})}">

<head>
	<title th:text="#{user}+#{title.input}+' | '+ #{shop.title}"> </title>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<link rel="stylesheet" type="text/css" th:href="@{/css/forms.css}" />
</head>

<body class="admin user_regist_input_admin">
	<div class="form-container admin-form">
		<div class="form-card admin">
			<div class="form-header with-border">
				<h2 class="form-title" th:text="#{user}+#{title.input}"></h2>
				<p class="form-subtitle" th:text="#{msg.regist.input}"></p>
			</div>

			<form th:action="@{/admin/user/regist/check}" method="post" class="user_info_form" th:object="${userForm}">
				<th:block th:if="${#fields.hasErrors()}">
					<div class="error-container">
						<ul class="error-list">
							<li th:each="err:${#fields.detailedErrors()}" th:text="${err.message}"></li>
						</ul>
					</div>
				</th:block>

				<div class="input-list">
					<div class="form-group">
						<label><span class="form-label">[[#{userForm.email}]]</span></label>
						<input type="text" th:field="*{email}" class="form-input" />
					</div>
					<div class="form-group">
						<label><span class="form-label">[[#{userForm.password}]]</span></label>
						<input type="password" th:field="*{password}" class="form-input" />
					</div>
					<div class="form-group">
						<label><span class="form-label">[[#{userForm.name}]]</span></label>
						<input type="text" th:field="*{name}" class="form-input" />
					</div>
					<div class="form-group">
						<label><span class="form-label">[[#{userForm.postalCode}]]</span></label>
						<input type="text" th:field="*{postalCode}" class="form-input" />
					</div>
					<div class="form-group">
						<label><span class="form-label">[[#{userForm.address}]]</span></label>
						<textarea rows="6" th:field="*{address}" class="form-textarea"></textarea>
					</div>
					<div class="form-group">
						<label><span class="form-label">[[#{userForm.phoneNumber}]]</span></label>
						<input type="text" th:field="*{phoneNumber}" class="form-input" />
					</div>
					<div class="form-group" th:if="${session.user.authority == 0 or session.user.authority == 1}">
						<label><span class="form-label">[[#{data.authority}]]</span></label>
						<div th:if="${session.user.authority == 0}" class="form-radio">
							<label>
								<input type="radio" name="authority" value="0" th:checked="*{authority == 0}" />[[#{auth.system.str}]]
							</label>
							<label>
								<input type="radio" name="authority" value="1" th:checked="*{authority == 1}" />[[#{auth.admin.str}]]
							</label>
							<label>
								<input type="radio" name="authority" value="2" th:checked="*{authority == 2}" />[[#{auth.client.str}]]
							</label>
						</div>
						<th:block th:if="${session.user.authority == 1}">
							<span class="form-help-text">[[#{auth.admin.str}]]</span>
						</th:block>
					</div>
				</div>

				<div class="form-actions two-buttons">
					<button type="submit" class="btn btn-primary send_button">確認</button>
					<a th:href="@{/admin/user/list}" class="btn btn-secondary back_button">戻る</a>
				</div>
			</form>
		</div>
	</div>
</body>

</html>
