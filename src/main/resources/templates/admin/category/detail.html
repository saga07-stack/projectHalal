<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	th:replace="~{common/layout_4block :: layout(~{::title},~{::body/content()})}">

<head>
	<title th:text="#{category}+#{title.detail}+' | '+ #{shop.title}"> </title>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
</head>

<body class="admin category_detail">
	<div class="form-container admin-form">
		<div class="form-card admin">
			<div class="form-header with-border">
				<h2 class="form-title" th:text="#{category}+#{title.detail}"></h2>
				<p class="form-subtitle">Category Details</p>
			</div>

			<div class="info_form_area" th:object="${category}">
				<div class="detail_area">
					<div class="input-list">
						<div class="form-group">
							<label class="form-label">[[#{categoryForm.name}]]</label>
							<span class="form-help-text" th:text="*{name}"></span>
						</div>
						<div class="form-group">
							<label class="form-label">[[#{categoryForm.description}]]</label>
							<span class="form-help-text" style="display: block; white-space: pre-wrap;" th:text="*{description}"></span>
						</div>
					</div>
				</div>

				<div class="form-actions">
					<div style="display: flex; gap: var(--spacing-md); width: 100%;">
						<a th:href="@{/admin/category/list}" class="btn btn-secondary back_button" style="flex: 1;">戻る</a>
						<a th:href="@{/admin/category/update/input/{id}(id=*{id})}" class="btn btn-primary" style="flex: 1;">変更</a>
						<form th:action="@{/admin/category/delete/check/{id}(id=*{id})}" method="post" style="flex: 1; margin: 0;">
							<button type="submit" class="btn btn-danger delete" style="width: 100%;">削除</button>
						</form>
					</div>
				</div>
			</div>
		</div>
	</div>
</body>

</html>
