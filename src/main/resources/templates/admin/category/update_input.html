<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	th:replace="~{common/layout_4block :: layout(~{::title},~{::body/content()})}">

<head>
	<title th:text="#{category}+#{title.update.input}+' | '+ #{shop.title}"> </title>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
</head>

<body class="admin category_update_input">
	<div class="form-container admin-form">
		<div class="form-card admin">
			<div class="form-header with-border">
				<h2 class="form-title" th:text="#{category}+#{title.update.input}"></h2>
				<p class="form-subtitle" th:text="#{msg.update.input}"></p>
			</div>

			<form th:action="@{/admin/category/update/check}" method="post" class="user_info_form" th:object="${categoryForm}">
				<th:block th:if="${#fields.hasErrors()}">
					<div class="error-container">
						<ul class="error-list">
							<li th:each="err:${#fields.detailedErrors()}" th:text="${err.message}"></li>
						</ul>
					</div>
				</th:block>

				<div class="input-list">
					<div class="form-group">
						<label class="form-label">[[#{categoryForm.name}]]</label>
						<input type="text" name="name" th:value="*{name}" class="form-input" />
					</div>
					<div class="form-group">
						<label class="form-label">[[#{categoryForm.description}]]</label>
						<textarea name="description" rows="6" th:field="*{description}" class="form-textarea"></textarea>
					</div>
				</div>

				<input type="hidden" th:field="*{id}" />

				<div class="form-actions two-buttons">
					<button type="submit" class="btn btn-primary send_button">確認</button>
					<a th:href="@{/admin/category/detail/{id}(id=${categoryForm.id})}" class="btn btn-secondary back_button">戻る</a>
				</div>
			</form>
		</div>
	</div>
</body>

</html>
