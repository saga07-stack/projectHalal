<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Book a table – Himal Kitchen</title>
    <meta name="description" content="Request a table online. We confirm by phone or email.">
    <link rel="stylesheet" href="css/style.css">
</head>

<body data-page="reserve"><a class="skip" href="#main">Skip to content</a>
    <header id="site-header"></header>
    <main id="main" class="wrap">
        <h1>Book a table</h1>
        <p>Send a request and we'll confirm by phone or email. Your table isn't guaranteed until we confirm.</p>
        <form id="booking-form" class="form" novalidate>
            <input type="checkbox" name="botcheck" class="hp" tabindex="-1" autocomplete="off" aria-hidden="true">
            <label>Full name<input name="name" required maxlength="80" autocomplete="name"></label>
            <label>Phone<input name="phone" type="tel" required maxlength="25" autocomplete="tel"></label>
            <label>Email<input name="email" type="email" required maxlength="100" autocomplete="email"></label>
            <div class="row"><label>Date<input name="date" type="date" required></label>
                <label>Time<input name="time" type="time" required></label>
                <label>Guests<select name="guests" required>
                        <option>1</option>
                        <option>2</option>
                        <option selected>3</option>
                        <option>4</option>
                        <option>5</option>
                        <option>6</option>
                        <option>7</option>
                        <option>8</option>
                        <option>9</option>
                        <option>10</option>
                    </select></label>
            </div>
            <label>Notes (optional)<textarea name="notes" rows="3" maxlength="500"></textarea></label>
            <button class="btn" type="submit">Send booking request</button>
            <p id="status" role="status" aria-live="polite"></p>
        </form>
    </main>
    <footer id="site-footer"></footer>
    <script src="js/data.js"></script>
    <script src="js/app.js"></script>
</body>

</html>
