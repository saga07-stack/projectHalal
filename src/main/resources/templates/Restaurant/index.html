<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">

<head> 
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
      <meta name="description" content="Fresh Nepali food, momo and dal bhat. See the menu and book a table online.">
   <link rel="stylesheet" type="text/css" th:href="@{/css/layout.css}" />
  <link rel="stylesheet" type="text/css" th:href="@{/css/stylesheet.css}" />
    <title>Himal Kitchen – Nepali restaurant</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body data-page="home"><a class="skip" href="#main">Skip to content</a>
    <header>
  <div th:replace="~{common/header :: layout-header('/restaurant/menu/search', 'Menu khojnus')}"></div>
		
	</header>
    <main id="main" class="wrap">
        <section class="hero">
            <h1 id="hero-title"></h1>
            <p id="hero-tag" class="lead"></p>
            <p><a class="btn" href="reserve.html">Book a table</a> <a class="btn alt" href="menu.html">See the menu</a>
            </p>
        </section>
        <section>
            <h2>Favourites</h2>
            <div class="grid" id="featured"></div>
        </section>
        <section>
            <h2>Opening hours</h2>
            <ul class="hours" id="hours"></ul>
        </section>
    </main>
    <footer>
        <div th:replace="~{common/footer :: layout-footer}"></div>
    </footer>
    <script src="js/data.js"></script>
    <script src="js/app.js"></script>
</body>

</html>
