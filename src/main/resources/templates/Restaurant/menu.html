<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <meta name="description" content="Our full menu with prices, ingredients and allergens.">
    <link rel="stylesheet" type="text/css" th:href="@{/css/layout.css}" />
    <link rel="stylesheet" type="text/css" th:href="@{/css/stylesheet.css}" />
    <title>Menu – Himal Kitchen</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body data-page="menu"><a class="skip" href="#main">Skip to content</a>
    <header>
       <div th:replace="~{common/header :: layout-header('/restaurant/menu/search', 'Menu khojnus')}"></div>
    </header>
    <main id="main" class="wrap">
        <h1>Menu</h1>
        <p>Prices in Nepali rupees. Tap a dish for ingredients and allergens. Booking a table doesn't pre-order food.
        </p>
        <a class="btn" href="reserve.html">Book a table</a>
        <div id="filters" class="filters"></div>
        <div class="grid" id="menu-list"></div>
    </main>
    <footer>
        <div th:replace="~{common/footer :: layout-footer}"></div>
    </footer>
    <script src="js/data.js"></script>
    <script src="js/app.js"></script>
</body>

</html>
