<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="stylesheet" type="text/css" th:href="@{/css/layout.css}" />
<link rel="stylesheet" type="text/css" th:href="@{/css/stylesheet.css}" />
<link rel="stylesheet" type="text/css" th:href="@{/css/hero-slider.css}" />

<title th:text="#{top}+' | '+ #{shop.title}"> </title>
</head>
<body class="user index">
	<!--/* Header */-->
	<header>
		<div th:replace="~{common/header :: layout-header('/client/item/list/1', 'search items')}"></div>
			</header>
	<!--/* Navigation Bar */-->
	
	<div class="container">
		
		<article class="main">
			<div>
			 <!--/* Hero slider: auto-advancing banner under "New Items" (slides are plain HTML, edit the text freely) */-->
<section class="hero-slider" aria-label="Promotions">
    <div class="hero-slide hero-slide-1">
     
        
        <h3 
        >Welcome to Nepali Pasal</h3>
        <p>Shop your everyday essentials in one place.</p> 
      <!--   <img th:src="@{/images/dashain_banner_v2.svg}" > --> 
    </div>
    <div class="hero-slide hero-slide-2">
        <h3>New arrivals</h3>
        <p>Check out the latest items we have just added to the shop.</p>
    <!-- <img th:src="@{/images/dashain_banner_v2.svg}" > --> 
    </div>
    <div class="hero-slide hero-slide-3">
         <h3>Save your favourites</h3>
        <p>Tap the heart to keep what you love, and the cart to start your order.</p>
    
    <!--   <img th:src="@{/images/dashain_banner_v2.svg}" > --> 
     </div>
    <div class="hero-slide hero-slide-4">
        <h3>Happy Dashain</h3>
    </div>
    <button type="button" class="hero-arrow hero-prev" aria-label="Previous slide">&#8249;</button>
    <button type="button" class="hero-arrow hero-next" aria-label="Next slide">&#8250;</button>
    <div class="hero-dots"></div>
</section>
 
<!--    ---------------  side bar -->
			
			
			
				<h2 class="title">
					New Items
				</h2>
			</div>
			
			<div class="item_list">
				<th:block th:each="item, status: ${items}" th:if="${status.count le 10}">
					<!--/* Product Information */-->
					<div class="item">
						<div class="item_name" th:text="${item.name}"></div>
						<a th:href="@{/client/item/detail/}+${item.id}">
							<img th:src="@{/images/{image}(image=${item.image})}" th:if="${item.image != null}" />
							<img th:src="@{/images/common/no_image.jpg}" th:if="${item.image == null}" />
						</a>
					</div>
				</th:block>
			</div>
		</article>
	</div>
<!-- 	---------------  side bar -->
	
<div id="container">
   
 

</div>
	<!--/* Footer */-->
	<footer>
		<div th:replace="~{common/footer :: layout-footer}"></div>
	</footer>
	<script type="text/javascript" th:src="@{/js/common.js}" defer></script>
	<!--/* Hero slider: auto-advance every 4s, pauses on hover/tab hidden, arrows, dots, swipe */-->
	<script type="text/javascript">
	(function () {
		const slider = document.querySelector('.hero-slider');
		if (!slider) return;

		const slides = Array.from(slider.querySelectorAll('.hero-slide'));
		const dotsWrap = slider.querySelector('.hero-dots');
		const INTERVAL = 4000;
		let current = 0;
		let timer = null;
		let hovered = false;

		slides.forEach(function (_, i) {
			const dot = document.createElement('button');
			dot.type = 'button';
			dot.className = 'hero-dot';
			dot.setAttribute('aria-label', 'Go to slide ' + (i + 1));
			dot.addEventListener('click', function () { show(i); start(); });
			dotsWrap.appendChild(dot);
		});
		const dots = Array.from(dotsWrap.children);

		function show(n) {
			current = (n + slides.length) % slides.length;
			slides.forEach(function (s, i) {
				const on = i === current;
				s.classList.toggle('is-active', on);
				s.setAttribute('aria-hidden', String(!on));
			});
			dots.forEach(function (d, i) { d.classList.toggle('is-active', i === current); });
		}

		function stop() {
			clearInterval(timer);
			timer = null;
		}

		function start() {
			stop();
			if (!hovered && !document.hidden) {
				timer = setInterval(function () { show(current + 1); }, INTERVAL);
			}
		}

		slider.querySelector('.hero-next').addEventListener('click', function () { show(current + 1); start(); });
		slider.querySelector('.hero-prev').addEventListener('click', function () { show(current - 1); start(); });

		slider.addEventListener('mouseenter', function () { hovered = true; stop(); });
		slider.addEventListener('mouseleave', function () { hovered = false; start(); });

		let touchX = null;
		slider.addEventListener('touchstart', function (e) { touchX = e.touches[0].clientX; }, { passive: true });
		slider.addEventListener('touchend', function (e) {
			if (touchX === null) return;
			const dx = e.changedTouches[0].clientX - touchX;
			if (Math.abs(dx) > 40) { show(dx < 0 ? current + 1 : current - 1); start(); }
			touchX = null;
		});

		document.addEventListener('visibilitychange', function () {
			if (document.hidden) { stop(); } else { start(); }
		});

		show(0);
		start();
	})();
	</script>
</body>
</html>
