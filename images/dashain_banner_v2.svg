<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 563" width="1600" height="563" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
